services:
  - type: web
    name: dispatch-load-balancer
    runtime: docker
    dockerContext: .
    dockerfilePath: Dockerfile
    envVars:
      - key: SPRING_DATASOURCE_URL
        fromDatabase:
          name: dispatch-db
          property: connectionString
      - key: SPRING_DATASOURCE_USERNAME
        fromDatabase:
          name: dispatch-db
          property: user
      - key: SPRING_DATASOURCE_PASSWORD
        fromDatabase:
          name: dispatch-db
          property: password

databases:
  - name: dispatch-db
    databaseName: dispatch_db
    user: dispatch_user
